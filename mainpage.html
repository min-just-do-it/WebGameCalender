<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>서브컬쳐 게임 캘린더</title>
  
  <link rel="stylesheet" href="main.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="todo.css">
</head>

<body>

  <script src="main.js" defer></script>
  <script src="calendar.js" defer></script>
  <script src="todo.js" defer></script>

  <div class="calendar">
  <div class="calendar-header">
    <button id="prevMonth">◀</button>
    <div id="currentMonthYear"></div>
    <button id="nextMonth">▶</button>
  </div>
  <div id="calendarDates" class="calendar-dates"></div>
</div>

<div class="todo-panel">
  <div class="tabs">
    <button class="tab-btn" onclick="switchTodoTab('daily')">Daily</button>
    <button class="tab-btn" onclick="switchTodoTab('weekly')">Weekly</button>
    <button class="tab-btn" onclick="switchTodoTab('monthly')">Monthly</button>
  </div>

  <h3 id="todo-label">하루 TODO</h3>
  <input id="todo-input-text" type="text" placeholder="할 일을 입력하세요.">
  <button onclick="addTodo()">등록</button>

  <ul id="todo-list"></ul>
</div>
</body>
</html>
