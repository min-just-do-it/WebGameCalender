<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>게임 캘린더</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./calendar.css" />
    <link rel="stylesheet" href="./todo.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-actions">
        <button class="button button-dark" id="add-game-button" type="button">+ 게임 추가</button>
        <button class="button button-dark" id="add-event-button" type="button">+ 일정 추가</button>
      </div>
      <h1>게임 캘린더</h1>
    </header>

    <main class="dashboard">
      <section class="calendar-panel" aria-labelledby="calendar-heading">
        <h2 id="calendar-heading">모든 게임 일정 모아보기</h2>
        <div id="calendar"></div>
      </section>
      <aside class="todo-panel" id="todo-list" aria-label="일정 요약"></aside>
    </main>

    <dialog class="modal" id="game-dialog">
      <form id="game-form" method="dialog">
        <div class="modal-header">
          <h2>게임 추가</h2>
          <button class="icon-button" type="button" data-close-dialog aria-label="닫기">×</button>
        </div>
        <label>게임 이름<input name="name" required maxlength="30" placeholder="예: 일일 퀘스트" /></label>
        <fieldset>
          <legend>일정 색상</legend>
          <input name="color" type="hidden" value="#6457e8" />
          <div class="color-options" id="game-color-options"></div>
        </fieldset>
        <div class="form-actions">
          <button class="button button-light" type="button" data-close-dialog>취소</button>
          <button class="button button-primary" type="submit">게임 저장</button>
        </div>
      </form>
    </dialog>

    <dialog class="modal" id="event-dialog">
      <form id="event-form" method="dialog">
        <div class="modal-header">
          <h2>일정 추가</h2>
          <button class="icon-button" type="button" data-close-dialog aria-label="닫기">×</button>
        </div>
        <label>게임<select name="gameId" id="event-game" required></select></label>
        <label>일정 제목<input name="title" required maxlength="60" placeholder="예: 주간 보상 수령" /></label>
        <div class="form-row">
          <label>날짜<input name="date" type="date" required /></label>
          <label>시간<input name="time" type="time" required /></label>
        </div>
        <p class="form-hint" id="no-games-hint">먼저 게임을 추가해주세요.</p>
        <div class="form-actions">
          <button class="button button-light" type="button" data-close-dialog>취소</button>
          <button class="button button-primary" type="submit">일정 저장</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
